name: build-apk

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APK: app/build/outputs/apk/release/app-release.apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache do Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restaurar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          ls -l "$RUNNER_TEMP/release.p12"

      - name: Build APK assinado
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verificar assinatura do APK
        run: |
          set -euo pipefail
          ls -l "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|application-label:"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$BRANCH" = "main" ]; then
            TAG="v0.1.$RUN"
            TITLE="v0.1.$RUN"
            EXTRA=""
          else
            TAG="beta-$RUN"
            TITLE="beta $RUN"
            EXTRA="--prerelease"
          fi
          gh release create "$TAG" "$APK#app-release.apk" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "Build $RUN — commit ${GITHUB_SHA::7} — branch $BRANCH" \
            $EXTRA

      - name: Resumo
        run: |
          {
            echo "### APK pronto"
            echo ""
            echo "- branch: \`$GITHUB_REF_NAME\`"
            echo "- run: $GITHUB_RUN_NUMBER"
            echo "- commit: \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
